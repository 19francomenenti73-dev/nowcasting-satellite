<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowcasting</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; }
    #header { padding: 8px; text-align: center; background: #1e293b; border-bottom: 1px solid #334155; }
    #time-label { font-size: 14px; color: #38bdf8; font-weight: bold; }
    
    #map { width: 100vw; height: calc(100vh - 95px); background: #0b0f19; }
    
    #controls { padding: 8px; background: #1e293b; display: flex; justify-content: center; align-items: center; gap: 4px; border-top: 1px solid #334155; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; z-index: 1000; }
    .btn { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 10px 8px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 12px; flex: 1; max-width: 110px; text-align: center; }
    .btn-active { background: #f59e0b; color: #000; border-color: #f59e0b; }
  </style>
</head>
<body>

  <div id="header">
    <div id="time-label">Caricamento in corso...</div>
  </div>
  
  <div id="map"></div>

  <div id="controls">
    <button class="btn" id="btn-sat" onclick="setMode('satellite')">Satellite IR</button>
    <button class="btn" id="btn-radar" onclick="setMode('radar')">Radar Pioggia</button>
    <button class="btn btn-active" id="btn-composite" onclick="setMode('composite')">Composito</button>
    <button class="btn" id="btn-play" onclick="togglePlay()">Pausa</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inizializzazione mappa centrata sull'Italia
    let map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Fondo Mappe OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let radarFrames = [];
    let radarLayers = [];
    let satLayers = [];
    let animIndex = 0;
    let timer = null;
    let isPlaying = true;
    let currentMode = 'composite';

    async function initWeather() {
      try {
        let res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        let data = await res.json();
        
        if (data.radar && data.radar.past) {
          radarFrames = data.radar.past;
          setMode('composite');
        }
      } catch (e) {
        document.getElementById('time-label').textContent = "Errore di connessione ai dati meteo";
      }
    }

    function setMode(mode) {
      currentMode = mode;
      if (timer) clearInterval(timer);

      // Aggiorna stato visivo bottoni
      document.getElementById('btn-sat').className = mode === 'satellite' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-radar').className = mode === 'radar' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-composite').className = mode === 'composite' ? 'btn btn-active' : 'btn';

      // Pulizia layer esistenti
      radarLayers.forEach(l => map.removeLayer(l.layer));
      satLayers.forEach(l => map.removeLayer(l));
      radarLayers = [];
      satLayers = [];

      if (radarFrames.length === 0) return;

      // Generazione layer
      radarFrames.forEach((item, idx) => {
        // Layer Satellite IR (Termico globale continuo)
        let satUrl = `https://tilecache.rainviewer.com${item.path}/256/{z}/{x}/{y}/0/0_0.png`;
        let satL = L.tileLayer(satUrl, {
          tileSize: 256,
          opacity: 0,
          transparent: true,
          zIndex: 50 + idx
        }).addTo(map);
        satLayers.push(satL);

        // Layer Radar Pioggia
        let radarUrl = `https://tilecache.rainviewer.com${item.path}/256/{z}/{x}/{y}/2/1_1.png`;
        let radarL = L.tileLayer(radarUrl, {
          tileSize: 256,
          opacity: 0,
          transparent: true,
          zIndex: 150 + idx
        }).addTo(map);
        radarLayers.push({ layer: radarL, time: item.time });
      });

      animIndex = radarLayers.length - 1;
      showFrame(animIndex);
      startLoop();
    }

    function showFrame(index) {
      if (radarLayers.length === 0) return;

      radarLayers.forEach((item, idx) => {
        let isCurrent = (idx === index);
        
        // Gestione opacità per Satellite
        if (satLayers[idx]) {
          satLayers[idx].setOpacity(isCurrent && (currentMode === 'satellite' || currentMode === 'composite') ? 0.7 : 0);
        }
        
        // Gestione opacità per Radar Pioggia
        if (item.layer) {
          item.layer.setOpacity(isCurrent && (currentMode === 'radar' || currentMode === 'composite') ? 0.85 : 0);
        }
      });

      let timeStr = new Date(radarLayers[index].time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let label = currentMode === 'composite' ? 'COMPOSITO (IR + RADAR)' : (currentMode === 'satellite' ? 'SATELLITE IR' : 'RADAR PIOGGIA');
      document.getElementById('time-label').textContent = `${label} - ${timeStr} (${index + 1}/${radarLayers.length})`;
    }

    function startLoop() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (!isPlaying || radarLayers.length === 0) return;
        animIndex = (animIndex + 1) % radarLayers.length;
        showFrame(animIndex);
      }, 700);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('btn-play').textContent = isPlaying ? "Pausa" : "Play";
    }

    initWeather();
  </script>

</body>
</html>
