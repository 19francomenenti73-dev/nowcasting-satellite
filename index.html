<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nowcasting Satellite & Radar</title>
  <!-- Leaflet CSS per la mappa interattiva -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    #header { padding: 10px; text-align: center; background: #1e293b; border-bottom: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 18px; margin: 0 0 4px 0; }
    #time-label { font-size: 13px; color: #f59e0b; font-weight: bold; }
    
    #map { width: 100%; height: calc(100vh - 120px); background: #0b0f19; }
    
    #controls { padding: 10px; background: #1e293b; display: flex; justify-content: center; align-items: center; gap: 8px; border-top: 1px solid #334155; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; z-index: 1000; }
    .btn { background: #38bdf8; color: #0b0f19; border: none; padding: 8px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-active { background: #f59e0b; }
  </style>
</head>
<body>

  <div id="header">
    <h1>SATELLITE & RADAR LIVE</h1>
    <div id="time-label">Caricamento fotogrammi in corso...</div>
  </div>
  
  <div id="map"></div>

  <div id="controls">
    <button class="btn" onclick="togglePlay()">Play / Pausa</button>
    <button class="btn btn-active" id="btn-sat" onclick="switchMode('satellite')">Satellite IR</button>
    <button class="btn" id="btn-radar" onclick="switchMode('radar')">Radar Pioggia</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inizializzazione mappa centrata sull'Italia
    let map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Sfondo mappa scuro ed elegante (CartoDB)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      subdomains: 'abcd'
    }).addTo(map);

    let radarFrames = [];
    let satFrames = [];
    let currentFrames = [];
    let animIndex = 0;
    let weatherLayer = null;
    let timer = null;
    let isPlaying = true;
    let currentMode = 'satellite';

    async function loadWeatherData() {
      try {
        let res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        let data = await res.json();
        
        if (data.radar && data.radar.past) {
          radarFrames = data.radar.past.map(item => item.path);
        }
        if (data.satellite && data.satellite.infrared) {
          satFrames = data.satellite.infrared.map(item => item.path);
        }

        setMode('satellite');
      } catch (e) {
        document.getElementById('time-label').textContent = "Errore di connessione ai dati meteo";
      }
    }

    function setMode(mode) {
      currentMode = mode;
      currentFrames = (mode === 'satellite') ? satFrames : radarFrames;
      animIndex = currentFrames.length - 1;

      document.getElementById('btn-sat').className = mode === 'satellite' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-radar').className = mode === 'radar' ? 'btn btn-active' : 'btn';

      if (currentFrames.length > 0) {
        updateLayer();
        startAnimation();
      }
    }

    function switchMode(mode) {
      setMode(mode);
    }

    function updateLayer() {
      if (currentFrames.length === 0) return;
      if (weatherLayer) map.removeLayer(weatherLayer);

      let path = currentFrames[animIndex];
      // Generatore tessere RainViewer (0 = infrarosso sat, 2 = radar)
      let colorCode = currentMode === 'satellite' ? 0 : 2;
      let tileUrl = `https://tilecache.rainviewer.com${path}/256/{z}/{x}/{y}/${colorCode}/1_1.png`;

      weatherLayer = L.tileLayer(tileUrl, {
        tileSize: 256,
        opacity: 0.85,
        transparent: true
      }).addTo(map);

      document.getElementById('time-label').textContent = `Modo: ${currentMode.toUpperCase()} (${animIndex + 1} di ${currentFrames.length})`;
    }

    function startAnimation() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (!isPlaying) return;
        animIndex = (animIndex + 1) % currentFrames.length;
        updateLayer();
      }, 700); // Velocità del loop temporale
    }

    function togglePlay() {
      isPlaying = !isPlaying;
    }

    loadWeatherData();
  </script>

</body>
</html>
