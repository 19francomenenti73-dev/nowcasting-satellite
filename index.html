l<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala Operativa Meteo - RainViewer Live</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; }
    #header { padding: 8px; text-align: center; background: #1e293b; border-bottom: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 16px; margin: 0; }
    #time-label { font-size: 12px; color: #f59e0b; font-weight: bold; margin-top: 2px; }
    
    #map { width: 100vw; height: calc(100vh - 105px); background: #0b0f19; }
    
    #controls { padding: 8px; background: #1e293b; display: flex; justify-content: center; align-items: center; gap: 4px; border-top: 1px solid #334155; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; z-index: 1000; }
    .btn { background: #38bdf8; color: #0b0f19; border: none; padding: 8px 10px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 11px; flex: 1; max-width: 110px; }
    .btn-active { background: #f59e0b; color: #000; }
  </style>
</head>
<body>

  <div id="header">
    <h1>SALA OPERATIVA METEO</h1>
    <div id="time-label">Connessione ai dati in corso...</div>
  </div>
  
  <div id="map"></div>

  <div id="controls">
    <button class="btn" id="btn-sat" onclick="setMode('satellite')">Satellite IR</button>
    <button class="btn" id="btn-radar" onclick="setMode('radar')">Radar Pioggia</button>
    <button class="btn btn-active" id="btn-composite" onclick="setMode('composite')">Composito</button>
    <button class="btn" id="btn-play" onclick="togglePlay()">Pausa</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inizializzazione mappa centrata sull'Italia
    let map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Mappa base OpenStreetMap (100% libera, zero chiavi API)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let satFrames = [];
    let radarFrames = [];
    let activePool = [];
    let animIndex = 0;
    let timer = null;
    let isPlaying = true;
    let currentMode = 'composite';

    async function initWeather() {
      try {
        let res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        let data = await res.json();
        
        if (data.satellite && data.satellite.infrared) {
          satFrames = data.satellite.infrared;
        }
        if (data.radar && data.radar.past) {
          radarFrames = data.radar.past;
        }

        // Avvia direttamente in modalità composito
        setMode('composite');
      } catch (e) {
        document.getElementById('time-label').textContent = "Errore di connessione ai server meteo";
      }
    }

    function setMode(mode) {
      currentMode = mode;
      if (timer) clearInterval(timer);

      // Aggiorna classe attiva dei bottoni
      document.getElementById('btn-sat').className = mode === 'satellite' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-radar').className = mode === 'radar' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-composite').className = mode === 'composite' ? 'btn btn-active' : 'btn';

      // Pulisci i layer precedenti dalla mappa
      activePool.forEach(item => {
        if (item.satLayer) map.removeLayer(item.satLayer);
        if (item.radarLayer) map.removeLayer(item.radarLayer);
      });
      activePool = [];

      // Scegli la sorgente in base al numero di fotogrammi disponibili
      let sourceFrames = (mode === 'satellite' && satFrames.length > 0) ? satFrames : radarFrames;
      if (sourceFrames.length === 0) sourceFrames = radarFrames;
      if (sourceFrames.length === 0) return;

      // Pre-caricamento di tutti i layer in memoria per garantire fluidità e zero sfarfallii
      sourceFrames.forEach((item, idx) => {
        let satLayer = null;
        let radarLayer = null;

        // Livello Satellite IR (Schema colore 0 o 3 per infrarosso)
        if (mode === 'satellite' || mode === 'composite') {
          let satPath = (satFrames[idx] && satFrames[idx].path) ? satFrames[idx].path : item.path;
          let satUrl = `https://tilecache.rainviewer.com${satPath}/256/{z}/{x}/{y}/0/1_1.png`;
          satLayer = L.tileLayer(satUrl, {
            tileSize: 256,
            opacity: 0,
            transparent: true,
            zIndex: 50 + idx
          }).addTo(map);
        }

        // Livello Radar Pioggia (Schema colore 2)
        if (mode === 'radar' || mode === 'composite') {
          let radarPath = (radarFrames[idx] && radarFrames[idx].path) ? radarFrames[idx].path : item.path;
          let radarUrl = `https://tilecache.rainviewer.com${radarPath}/256/{z}/{x}/{y}/2/1_1.png`;
          radarLayer = L.tileLayer(radarUrl, {
            tileSize: 256,
            opacity: 0,
            transparent: true,
            zIndex: 150 + idx
          }).addTo(map);
        }

        activePool.push({ satLayer, radarLayer, time: item.time });
      });

      animIndex = activePool.length - 1;
      showFrame(animIndex);
      startLoop();
    }

    function showFrame(index) {
      if (activePool.length === 0) return;

      activePool.forEach((item, idx) => {
        let isCurrent = (idx === index);
        if (item.satLayer) item.satLayer.setOpacity(isCurrent ? 0.75 : 0);
        if (item.radarLayer) item.radarLayer.setOpacity(isCurrent ? 0.85 : 0);
      });

      let timeStr = new Date(activePool[index].time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let modeName = currentMode === 'composite' ? 'Composito (IR + Radar)' : (currentMode === 'satellite' ? 'Satellite IR' : 'Radar Pioggia');
      document.getElementById('time-label').textContent = `${modeName} - Ore ${timeStr} (${index + 1}/${activePool.length})`;
    }

    function startLoop() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (!isPlaying || activePool.length === 0) return;
        animIndex = (animIndex + 1) % activePool.length;
        showFrame(animIndex);
      }, 750); // Intervallo fluido di 750ms per fotogramma
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('btn-play').textContent = isPlaying ? "Pausa" : "Play";
    }

    initWeather();
  </script>

</body>
</html>
