<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala Operativa Meteo - Composito Live</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; }
    #header { padding: 8px; text-align: center; background: #1e293b; border-bottom: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 16px; margin: 0; }
    #time-label { font-size: 12px; color: #f59e0b; font-weight: bold; margin-top: 2px; }
    
    #map { width: 100vw; height: calc(100vh - 105px); background: #0b0f19; }
    
    #controls { padding: 8px; background: #1e293b; display: flex; justify-content: center; align-items: center; gap: 4px; border-top: 1px solid #334155; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; z-index: 1000; }
    .btn { background: #38bdf8; color: #0b0f19; border: none; padding: 8px 10px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 11px; flex: 1; max-width: 110px; }
    .btn-active { background: #f59e0b; color: #000; }
  </style>
</head>
<body>

  <div id="header">
    <h1>SALA OPERATIVA METEO</h1>
    <div id="time-label">Caricamento fotogrammi in corso...</div>
  </div>
  
  <div id="map"></div>

  <div id="controls">
    <button class="btn" id="btn-sat" onclick="setMode('satellite')">Satellite IR</button>
    <button class="btn" id="btn-radar" onclick="setMode('radar')">Radar Pioggia</button>
    <button class="btn btn-active" id="btn-composite" onclick="setMode('composite')">Composito</button>
    <button class="btn" id="btn-play" onclick="togglePlay()">Pausa</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inizializzazione mappa centrata sull'Italia
    let map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Mappa base OpenStreetMap pulita e gratuita
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let weatherFrames = [];
    let activeLayersPool = [];
    let animIndex = 0;
    let timer = null;
    let isPlaying = true;
    let currentMode = 'composite'; // Default su Composito

    async function initWeather() {
      try {
        let res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        let data = await res.json();
        
        if (data.radar && data.radar.past) {
          weatherFrames = data.radar.past;
          setMode('composite');
        }
      } catch (e) {
        document.getElementById('time-label').textContent = "Errore di connessione ai dati meteo";
      }
    }

    function setMode(mode) {
      currentMode = mode;
      if (timer) clearInterval(timer);

      // Aggiorna stile bottoni
      document.getElementById('btn-sat').className = mode === 'satellite' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-radar').className = mode === 'radar' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-composite').className = mode === 'composite' ? 'btn btn-active' : 'btn';

      // Pulisci vecchi layer dalla mappa
      activeLayersPool.forEach(item => {
        if (item.satLayer) map.removeLayer(item.satLayer);
        if (item.radarLayer) map.removeLayer(item.radarLayer);
      });
      activeLayersPool = [];

      if (weatherFrames.length === 0) return;

      // Crea i pool di layer pre-caricati per ogni fotogramma temporale
      weatherFrames.forEach((item, idx) => {
        let satLayer = null;
        let radarLayer = null;

        // Se serve il satellite (IR)
        if (mode === 'satellite' || mode === 'composite') {
          let satUrl = `https://tilecache.rainviewer.com${item.path}/256/{z}/{x}/{y}/0/1_1.png`;
          satLayer = L.tileLayer(satUrl, {
            tileSize: 256,
            opacity: 0,
            transparent: true,
            zIndex: 50 + idx
          }).addTo(map);
        }

        // Se serve il radar (Pioggia)
        if (mode === 'radar' || mode === 'composite') {
          let radarUrl = `https://tilecache.rainviewer.com${item.path}/256/{z}/{x}/{y}/2/1_1.png`;
          radarLayer = L.tileLayer(radarUrl, {
            tileSize: 256,
            opacity: 0,
            transparent: true,
            zIndex: 150 + idx
          }).addTo(map);
        }

        activeLayersPool.push({ satLayer, radarLayer, time: item.time });
      });

      animIndex = activeLayersPool.length - 1;
      showFrame(animIndex);
      startLoop();
    }

    function showFrame(index) {
      if (activeLayersPool.length === 0) return;

      activeLayersPool.forEach((item, idx) => {
        let isCurrent = (idx === index);
        if (item.satLayer) item.satLayer.setOpacity(isCurrent ? 0.75 : 0);
        if (item.radarLayer) item.radarLayer.setOpacity(isCurrent ? 0.85 : 0);
      });

      let timeStr = new Date(activeLayersPool[index].time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let modeName = currentMode === 'composite' ? 'Composito (IR + Radar)' : (currentMode === 'satellite' ? 'Satellite IR' : 'Radar Pioggia');
      document.getElementById('time-label').textContent = `${modeName} - Ore ${timeStr} (${index + 1}/${activeLayersPool.length})`;
    }

    function startLoop() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (!isPlaying || activeLayersPool.length === 0) return;
        animIndex = (animIndex + 1) % activeLayersPool.length;
        showFrame(animIndex);
      }, 700);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('btn-play').textContent = isPlaying ? "Pausa" : "Play";
    }

    initWeather();
  </script>

</body>
</html>
