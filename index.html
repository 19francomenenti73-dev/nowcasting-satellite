<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala Operativa Meteo - NASA & Radar</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; }
    #header { padding: 8px; text-align: center; background: #1e293b; border-bottom: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 16px; margin: 0; }
    #time-label { font-size: 12px; color: #f59e0b; font-weight: bold; margin-top: 2px; }
    
    #map { width: 100vw; height: calc(100vh - 105px); background: #0b0f19; }
    
    #controls { padding: 8px; background: #1e293b; display: flex; justify-content: center; align-items: center; gap: 6px; border-top: 1px solid #334155; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; z-index: 1000; }
    .btn { background: #38bdf8; color: #0b0f19; border: none; padding: 10px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 12px; flex: 1; max-width: 140px; }
    .btn-active { background: #f59e0b; color: #000; }
  </style>
</head>
<body>

  <div id="header">
    <h1>SALA OPERATIVA METEO</h1>
    <div id="time-label">Caricamento dati in corso...</div>
  </div>
  
  <div id="map"></div>

  <div id="controls">
    <button class="btn btn-active" id="btn-sat" onclick="setMode('satellite')">Satellite NASA</button>
    <button class="btn" id="btn-radar" onclick="setMode('radar')">Radar Pioggia</button>
    <button class="btn" id="btn-play" style="display:none;" onclick="togglePlay()">Pausa</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inizializzazione mappa centrata sull'Italia
    let map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Mappa base OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let currentLayer = null;
    let radarFrames = [];
    let radarLayers = [];
    let animIndex = 0;
    let timer = null;
    let isPlaying = true;
    let mode = 'satellite';

    // Calcola la data di ieri per sicurezza disponibilità immagini NASA
    let d = new Date();
    d.setDate(d.getDate() - 1);
    let dateStr = d.toISOString().split('T')[0];

    function setMode(selectedMode) {
      mode = selectedMode;
      if (timer) clearInterval(timer);
      if (currentLayer) map.removeLayer(currentLayer);
      radarLayers.forEach(l => map.removeLayer(l));
      radarLayers = [];

      document.getElementById('btn-sat').className = mode === 'satellite' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-radar').className = mode === 'radar' ? 'btn btn-active' : 'btn';
      document.getElementById('btn-play').style.display = mode === 'radar' ? 'block' : 'none';

      if (mode === 'satellite') {
        loadNASA_Satellite();
      } else {
        loadRainViewer_Radar();
      }
    }

    // 1. Carica il Satellite NASA (Immagine reale in alta definizione)
    function loadNASA_Satellite() {
      document.getElementById('time-label').textContent = `Satellite NASA (Data: ${dateStr})`;
      
      // Tile Layer ufficiale NASA GIBS (VIIRS True Color)
      currentLayer = L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${dateStr}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`, {
        tileSize: 256,
        maxZoom: 9,
        opacity: 0.9,
        attribution: 'NASA EOSDIS GIBS'
      }).addTo(map);
    }

    // 2. Carica il Radar Pioggia Animato
    async function loadRainViewer_Radar() {
      document.getElementById('time-label').textContent = "Caricamento animazione radar...";
      try {
        let res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        let data = await res.json();
        
        if (data.radar && data.radar.past) {
          radarFrames = data.radar.past;
          
          radarFrames.forEach((item, idx) => {
            let tileUrl = `https://tilecache.rainviewer.com${item.path}/256/{z}/{x}/{y}/2/1_1.png`;
            let l = L.tileLayer(tileUrl, {
              tileSize: 256,
              opacity: 0,
              transparent: true,
              zIndex: 100 + idx
            }).addTo(map);
            radarLayers.push({ layer: l, time: item.time });
          });

          animIndex = radarLayers.length - 1;
          showRadarFrame(animIndex);
          startRadarLoop();
        }
      } catch (e) {
        document.getElementById('time-label').textContent = "Errore caricamento radar";
      }
    }

    function showRadarFrame(index) {
      if (radarLayers.length === 0) return;
      radarLayers.forEach((item, idx) => {
        item.layer.setOpacity(idx === index ? 0.8 : 0);
      });
      let timeStr = new Date(radarLayers[index].time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('time-label').textContent = `Radar Pioggia - Ore ${timeStr} (${index + 1}/${radarLayers.length})`;
    }

    function startRadarLoop() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if (!isPlaying || mode !== 'radar') return;
        animIndex = (animIndex + 1) % radarLayers.length;
        showRadarFrame(animIndex);
      }, 700);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('btn-play').textContent = isPlaying ? "Pausa" : "Play";
    }

    // Avvio predefinito su Satellite NASA
    setMode('satellite');
  </script>

</body>
</html>
